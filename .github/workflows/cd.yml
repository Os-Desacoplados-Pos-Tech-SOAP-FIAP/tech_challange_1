name: CD

# Dispara após o workflow de CI concluir com sucesso em `main`, garantindo que
# só fazemos build/deploy de código que passou em lint + testes + cobertura.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

# OIDC: assume a role da AWS sem chaves estáticas.
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER: oficina-mecanica
  ECR_REPOSITORY: oficina-mecanica-api

jobs:
  build-and-push:
    name: Build e push da imagem (ECR)
    # Só roda se o CI passou E o CD estiver habilitado. O gate `vars.ENABLE_CD`
    # evita runs vermelhos em `main` enquanto a infra (Terraform) e o secret
    # AWS_ROLE_ARN não estiverem provisionados. Habilite uma única vez definindo
    # a variável de repositório ENABLE_CD=true — depois o fluxo é automático.
    if: ${{ github.event.workflow_run.conclusion == 'success' && vars.ENABLE_CD == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.login-ecr.outputs.registry }}
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - name: Checkout (commit que passou no CI)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Define a tag da imagem (SHA do commit)
        id: vars
        run: echo "image_tag=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

      - name: Configura credenciais AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build e push da imagem
        # ECR usa tags IMMUTABLE (DEV-62); publicamos apenas por SHA imutável.
        # O Deployment fixa esse SHA via kustomize, então `latest` é desnecessário.
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.vars.outputs.image_tag }}
        run: |
          docker build -f docker/Dockerfile -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

  deploy:
    name: Deploy no EKS
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (commit que passou no CI)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configura credenciais AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Instala o kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Atualiza o kubeconfig do cluster
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"

      - name: Fixa a imagem (SHA) no overlay de produção
        env:
          REGISTRY: ${{ needs.build-and-push.outputs.registry }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          cd k8s/overlays/prod
          kustomize edit set image "oficina-mecanica-api=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Aplica os manifestos e aguarda o rollout
        run: |
          kubectl apply -k k8s/overlays/prod
          kubectl rollout status deployment/oficina-api -n oficina-mecanica --timeout=5m

      - name: Rollback automático se o rollout falhar
        if: failure()
        run: kubectl rollout undo deployment/oficina-api -n oficina-mecanica
