name: CD

# Entrega contínua local: após o CI passar em `main`, a esteira faz o build da
# imagem e o DEPLOY de verdade em um cluster Kubernetes (kind) efêmero, criado no
# próprio runner. Assim o histórico do GitHub Actions contempla o Deploy sem
# depender de AWS. O alvo de produção (EKS/RDS) está descrito em `infra/` (Terraform).
on:
  # TEMPORÁRIO: permite testar a esteira de CD nesta branch antes do merge.
  push:
    branches: [feat/cd-deploy-local-kind]
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-local
  cancel-in-progress: true

jobs:
  deploy-kind:
    name: Build e Deploy (cluster kind efêmero)
    # Roda no push de teste, no dispatch manual, ou quando o CI passou em main.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (commit que passou no CI)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Build da imagem da API
        run: docker build -f docker/Dockerfile -t oficina-mecanica-api:ci .

      - name: Cria o cluster kind
        uses: helm/kind-action@v1
        with:
          cluster_name: oficina-ci
          node_image: kindest/node:v1.29.4

      - name: Carrega a imagem no cluster kind
        run: kind load docker-image oficina-mecanica-api:ci --name oficina-ci

      - name: Deploy (Kustomize overlay de CI)
        run: kubectl apply -k k8s/overlays/ci

      - name: Aguarda o Postgres ficar pronto
        run: kubectl wait --for=condition=ready pod -l app=postgres -n oficina-mecanica --timeout=180s

      - name: Aguarda o rollout da API
        id: rollout
        # Cobre o initContainer de migrations + boot da app (readiness em /api/health).
        run: kubectl rollout status deployment/oficina-api -n oficina-mecanica --timeout=300s

      - name: Smoke test do endpoint /api/health
        run: |
          POD=$(kubectl get pod -n oficina-mecanica -l app.kubernetes.io/component=api -o jsonpath='{.items[0].metadata.name}')
          kubectl exec -n oficina-mecanica "$POD" -- wget -qO- http://localhost:3000/api/health | tee /dev/stderr | grep -q '"status":"ok"'

      - name: Estado final do deploy
        run: kubectl get deployment,svc,hpa,pods -n oficina-mecanica

      - name: Diagnóstico (somente em falha)
        if: failure()
        run: |
          kubectl get all -n oficina-mecanica || true
          kubectl describe pods -n oficina-mecanica || true
          kubectl logs -n oficina-mecanica -l app.kubernetes.io/component=api --all-containers --tail=100 || true

      - name: Rollback automático se o rollout falhar
        # Só desfaz quando o ROLLOUT especificamente falhou (não em erro de apply).
        if: ${{ failure() && steps.rollout.outcome == 'failure' }}
        run: kubectl rollout undo deployment/oficina-api -n oficina-mecanica || true
