name: CD

# Entrega contínua real: após o CI passar em `main`, faz o build da imagem, publica
# no ECR e faz o DEPLOY no cluster EKS (Kustomize overlay prod), injetando o Secret
# a partir do AWS Secrets Manager. Verificado por `kubectl rollout status` e smoke
# test em /api/health. Autenticação na AWS via OIDC (sem access keys).
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: cd-eks
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT: '538880133939'
  ROLE_ARN: arn:aws:iam::538880133939:role/gha-tech_challange_1
  CLUSTER: oficina-mecanica
  ECR_REPO: oficina-mecanica-api
  NAMESPACE: oficina-mecanica

jobs:
  deploy:
    name: Build, push e deploy no EKS
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (commit que passou no CI)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Credenciais AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Cluster disponível?
        id: cluster
        # A infra é provisionada sob demanda (apply/destroy por sessão). Sem cluster,
        # o deploy é pulado com aviso em vez de falhar a esteira.
        run: |
          STATUS=$(aws eks describe-cluster --name "$CLUSTER" --query cluster.status --output text 2>/dev/null || echo AUSENTE)
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          if [ "$STATUS" != "ACTIVE" ]; then
            echo "::warning::Cluster $CLUSTER indisponivel ($STATUS) - infra derrubada? Deploy pulado."
          fi

      - name: Login no ECR
        if: steps.cluster.outputs.status == 'ACTIVE'
        run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin "$AWS_ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com"
          echo "ECR_URL=$AWS_ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO" >> "$GITHUB_ENV"

      - name: Build e push da imagem (tag = SHA imutável)
        if: steps.cluster.outputs.status == 'ACTIVE'
        run: |
          docker build -f docker/Dockerfile -t "$ECR_URL:$GITHUB_SHA" .
          docker push "$ECR_URL:$GITHUB_SHA"

      - name: Kubeconfig
        if: steps.cluster.outputs.status == 'ACTIVE'
        run: aws eks update-kubeconfig --name "$CLUSTER" --region "$AWS_REGION"

      - name: Namespace e Secret (do AWS Secrets Manager)
        if: steps.cluster.outputs.status == 'ACTIVE'
        run: |
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          DATABASE_URL=$(aws secretsmanager get-secret-value --secret-id oficina-mecanica/DATABASE_URL --query SecretString --output text)
          JWT_SECRET=$(aws secretsmanager get-secret-value --secret-id oficina-mecanica/JWT_SECRET --query SecretString --output text)
          kubectl create secret generic oficina-api-secret -n "$NAMESPACE" \
            --from-literal=DATABASE_URL="$DATABASE_URL" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy (Kustomize overlay prod)
        if: steps.cluster.outputs.status == 'ACTIVE'
        run: |
          cd k8s/overlays/prod
          kustomize edit set image "oficina-mecanica-api=$ECR_URL:$GITHUB_SHA"
          kubectl apply -k .

      - name: Rollout (cobre o initContainer de migrations)
        if: steps.cluster.outputs.status == 'ACTIVE'
        id: rollout
        run: kubectl rollout status deployment/oficina-api -n "$NAMESPACE" --timeout=300s

      - name: Seed do banco (primeira carga; ignora se já houver dados)
        if: steps.cluster.outputs.status == 'ACTIVE'
        run: |
          POD=$(kubectl get pod -n "$NAMESPACE" -l app.kubernetes.io/component=api -o jsonpath='{.items[0].metadata.name}')
          kubectl exec -n "$NAMESPACE" "$POD" -- npx --no-install prisma db seed \
            || echo "::warning::seed nao aplicado (provavelmente dados ja existentes)"

      - name: Smoke test /api/health
        if: steps.cluster.outputs.status == 'ACTIVE'
        run: |
          POD=$(kubectl get pod -n "$NAMESPACE" -l app.kubernetes.io/component=api -o jsonpath='{.items[0].metadata.name}')
          kubectl exec -n "$NAMESPACE" "$POD" -- wget -qO- http://localhost:3000/api/health | tee /dev/stderr | grep -q '"status":"ok"'

      - name: Endereço público (ALB do Ingress)
        if: steps.cluster.outputs.status == 'ACTIVE'
        run: |
          kubectl get ingress oficina-api -n "$NAMESPACE" \
            -o jsonpath='ALB: {.status.loadBalancer.ingress[0].hostname}{"\n"}' || true

      - name: Estado final
        if: steps.cluster.outputs.status == 'ACTIVE'
        run: kubectl get deployment,svc,ingress,hpa,pods -n "$NAMESPACE"

      - name: Diagnóstico (somente em falha)
        if: failure()
        run: |
          kubectl get all -n "$NAMESPACE" || true
          kubectl describe pods -n "$NAMESPACE" || true
          kubectl logs -n "$NAMESPACE" -l app.kubernetes.io/component=api --all-containers --tail=100 || true

      - name: Rollback automático se o rollout falhar
        if: ${{ failure() && steps.rollout.outcome == 'failure' }}
        run: kubectl rollout undo deployment/oficina-api -n "$NAMESPACE" || true
