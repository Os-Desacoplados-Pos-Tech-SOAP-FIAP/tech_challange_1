name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Lint, testes e cobertura
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instala dependências
        run: npm ci

      - name: Gera Prisma Client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Testes (unit + e2e) com cobertura
        # test:cov roda os dois projetos do Jest (unit e e2e) e aplica o gate de
        # 80% (lines/branches/functions/statements) definido no jest.config.ts.
        run: npm run test:cov

      - name: Publica relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: warn
