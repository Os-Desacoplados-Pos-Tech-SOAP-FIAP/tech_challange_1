version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: oficina-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: oficina
      POSTGRES_PASSWORD: oficina123
      POSTGRES_DB: oficina_mecanica
    ports:
      - '5432:5432'
    volumes:
      - oficina-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oficina -d oficina_mecanica']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - oficina-net

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: oficina-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://oficina:oficina123@db:5432/oficina_mecanica?schema=public
      JWT_SECRET: ${JWT_SECRET:-sua-chave-secreta-aqui-mude-em-producao}
      JWT_EXPIRES_IN: 8h
      PORT: 3000
      NODE_ENV: production
    ports:
      - '3000:3000'
    command: sh -c "npx prisma migrate deploy && npx prisma db seed && node dist/main.js"
    networks:
      - oficina-net

volumes:
  oficina-db-data:

networks:
  oficina-net:
    driver: bridge
