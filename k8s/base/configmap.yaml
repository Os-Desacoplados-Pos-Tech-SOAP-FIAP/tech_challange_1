apiVersion: v1
kind: ConfigMap
metadata:
  name: oficina-api-config
  labels:
    app.kubernetes.io/name: oficina-mecanica
    app.kubernetes.io/component: api
data:
  # Configuração não-sensível da API. Segredos (DATABASE_URL, JWT_SECRET) ficam no Secret.
  NODE_ENV: "production"
  PORT: "3000"
  JWT_EXPIRES_IN: "8h"
  LOG_LEVEL: "info"
  # Telemetria: exporta traces e métricas OTLP para o Grafana Alloy (namespace
  # observability), que encaminha ao Grafana Cloud. Sem esta variável a app roda
  # normalmente, apenas sem telemetria.
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://grafana-k8s-monitoring-alloy-receiver.observability.svc.cluster.local:4318"
  OTEL_SERVICE_NAME: "oficina-api"
