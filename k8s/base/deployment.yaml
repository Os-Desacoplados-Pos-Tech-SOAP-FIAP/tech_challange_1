apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-api
  labels:
    app.kubernetes.io/name: oficina-mecanica
    app.kubernetes.io/component: api
spec:
  # Réplicas iniciais; o HPA (DEV-57) assume o controle de escala em runtime.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: oficina-mecanica
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oficina-mecanica
        app.kubernetes.io/component: api
    spec:
      # Aplica as migrations antes do container principal subir. O Prisma CLI está
      # em dependencies (presente na imagem de produção), então usamos o binário
      # local (--no-install) — deploy determinístico, sem download em runtime.
      initContainers:
        - name: prisma-migrate
          image: oficina-mecanica-api:latest
          command: ['npx', '--no-install', 'prisma', 'migrate', 'deploy']
          envFrom:
            - secretRef:
                name: oficina-api-secret
      containers:
        - name: api
          image: oficina-mecanica-api:latest
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: oficina-api-config
            - secretRef:
                name: oficina-api-secret
          # Liveness/readiness no endpoint público /api/health (sem auth, sem DB).
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          # Requests/limits compatíveis com as métricas do HPA (CPU/memória).
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
