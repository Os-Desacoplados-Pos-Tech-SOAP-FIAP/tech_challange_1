apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Aplicado a todos os recursos namespaced (ConfigMap, Secret). O recurso
# Namespace abaixo é cluster-scoped e é ignorado por este transformer.
namespace: oficina-mecanica

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  # Service, Ingress e HPA entram aqui nas issues DEV-56..DEV-57.

# Imagem parametrizada: o CD (DEV-65) faz `kustomize edit set image
# oficina-mecanica-api=<ECR>:<SHA>` no overlay de produção.
images:
  - name: oficina-mecanica-api
    newTag: latest
