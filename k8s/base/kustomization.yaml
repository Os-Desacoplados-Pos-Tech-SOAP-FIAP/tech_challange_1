apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Aplicado a todos os recursos namespaced (ConfigMap, Secret). O recurso
# Namespace abaixo é cluster-scoped e é ignorado por este transformer.
namespace: oficina-mecanica

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  # Deployment, Service, Ingress e HPA entram aqui nas issues DEV-55..DEV-57.
