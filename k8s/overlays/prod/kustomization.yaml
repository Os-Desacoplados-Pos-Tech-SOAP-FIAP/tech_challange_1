apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: oficina-mecanica

resources:
  - ../../base

# O Secret real é injetado pelo CD a partir do AWS Secrets Manager (DATABASE_URL e
# JWT_SECRET) — credenciais nunca são versionadas. Remove o template da base.
patches:
  - patch: |-
      apiVersion: v1
      kind: Secret
      metadata:
        name: oficina-api-secret
        namespace: oficina-mecanica
      $patch: delete
