apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: oficina-mecanica

resources:
  - ../../base

# Ajustes de desenvolvimento sobre a base: log verboso e NODE_ENV=development.
patches:
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: oficina-api-config
      data:
        NODE_ENV: "development"
        LOG_LEVEL: "debug"
